function setDyn(k,p){dropNode(k);for(const n of Object.keys(P))if(n.startsWith('wd_'+k+'_')){dropNode(n);delete P[n];}P[k]=p;linkNode(k,true,'wd_'+k+'_');return k;}

const nearFixed=(c,p)=>['mina_plaza','mumu_plaza'].some(k=>Math.abs(P[k][0]-p[0])<(sw(c)+36)/2+4&&Math.abs(P[k][1]-p[1])<54);// 米娜/沐沐固定廣場點永遠保留
function pickPlaza(c){const ok=PAVE.filter(p=>walkable(p[0],p[1])&&!inFront(p)&&!nearFixed(c,p)&&fits(c,p));if(!ok.length)return null;

 let best=null,bn=-1;for(let i=0;i<40;i++){const p=ok[Math.floor(Math.random()*ok.length)];const n=ok.filter(q=>Math.abs(q[0]-p[0])>=(sw(c)+45)/2+4||Math.abs(q[1]-p[1])>=54).length;if(n>bn){bn=n;best=p;}}

function pickBoard(c){const ok=PAVE.filter(p=>walkable(p[0],p[1])&&p[1]>=496&&p[0]>600&&p[0]<800&&!nearFixed(c,p)&&fits(c,p));if(!ok.length){const alt=PAVE.filter(p=>walkable(p[0],p[1])&&p[1]>=496&&!nearFixed(c,p)&&fits(c,p));if(!alt.length){const q=altSpot(c,[700,528])||farSpot(c,[700,528]);return q?setDyn('db_'+c.id,q):(c.path.length?c.path[c.path.length-1]:c.node);}alt.sort((a,b)=>Math.hypot(a[0]-700,a[1]-528)-Math.hypot(b[0]-700,b[1]-528));return setDyn('db_'+c.id,alt[0]);}ok.sort((a,b)=>Math.abs(a[0]-700)+Math.abs(a[1]-528)*2-Math.abs(b[0]-700)-Math.abs(b[1]-528)*2);return setDyn('db_'+c.id,ok[0]);}
function goTo(c,state){leaveSeat(c);c.wandering=false;c.waitPlaza=false;if(state==='plaza'||!SPOTS[c.id][state])state='rest';/* 2026-11-01 已取消「廣場」狀態：一律當休息（閒晃，廣場仍是閒晃目的地之一） */c.state=state;let tgt=SPOTS[c.id][state];if(P[tgt]&&!SPOT_SEAT[tgt]&&!fits(c,P[tgt])){const a=altSpot(c,P[tgt]);if(a)tgt=setDyn('da_'+c.id,a);}bumpSitters(c,P[tgt]);const from=c.path.length?c.path[0]:c.node;

function drawSit(c){const m=SITM.items[c.id],s0=c.sitting.seat,hh=(c.id==='mina'?62:c.id==='mumu'?60:50)*depthScale(s0.ay)*m.k,s=hh/SITM.h,br=1+0.012*Math.sin(c.t*2+m.sx);

function depthScale(y){return 0.9+0.25*(y-150)/730;}
function update(c,dt){c.t+=dt;
 if(c.path.length){const n=c.path[0],tx=P[n][0],ty=P[n][1],dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),step=c.speed*dt*depthScale(c.y);
  if(Math.abs(dx)>0.5)c.face=dx>0?1:-1;c.vdir=Math.abs(dy)>Math.abs(dx)*1.2?Math.sign(dy):0;
  if(d<=step){c.x=tx;c.y=ty;c.node=n;c.path.shift();if(!c.path.length){c.t=0;if(c.id==='mumu'&&Math.random()<.5){c.once=Math.random()<.5?'wave':'jump';c.t=0;}}}
  else{c.x+=dx/d*step;c.y+=dy/d*step;}c.anim='walk';}

}

function drawMumu(c){const s=58/198*depthScale(c.y);let row=0,col=0;

let CHAT_BUSY=false,CHAT_LAST=0,CHAT_FAST=0,CHAT_KICK=null;// 聊天輪詢：送出後 2 分鐘內每 2 秒（2026-11-01 由 3 秒加快），平常 10 秒；回到頁面立刻抓（1 秒去抖）；不重疊請求

 if(!j.ok)return $('gE').textContent=j.error||'失敗';const i=GROUPS.findIndex(g=>g.id===j.item.id);if(i>=0)GROUPS[i]=j.item;else GROUPS.push(j.item);CHAT_TO=j.item.id;$('gS').hidden=true;renderChat();};

 if(!j.ok)return $('gE').textContent=j.error||'刪除失敗';GROUPS=GROUPS.filter(g=>g.id!==G_EDIT.id);CHAT=CHAT.filter(m=>m.group!==G_EDIT.id);CHAT_TO='全體';$('gS').hidden=true;renderChat();};
window.ISLAND.openGroup=openGroup;window.ISLAND.chatPoll=chatPoll;window.ISLAND.setChat=(items,to)=>{CHAT=items;if(to)CHAT_TO=to;renderChat();updBtnDot();};window.ISLAND.setTab=setTab;


// ---- 點小人開一對一聊天（點擊範圍：身體附近，螢幕上至少 30px 半徑，手機也好點）----
function charAt(sx,sy,mv){let best=null,bd=1e9;for(const c of chars){const h=60*depthScale(c.y),k=(mv&&c.path.length&&!c.sitting)?mv:1;// mv：走動中的人點擊範圍放大（手指追不上）
 const cx=(c.x-cam.x)*cam.z+innerWidth/2,cy=(c.y-h*0.45-cam.y)*cam.z+innerHeight/2;
 const rx=Math.max(30,h*0.35*cam.z)*k,ry=Math.max(34,h*0.6*cam.z)*k;const d=((sx-cx)/rx)**2+((sy-cy)/ry)**2;if(d<=1&&d<bd){bd=d;best=c;}}return best;}
let PENDING_CHAT=null;
// 點小人/選聊天對象：鏡頭平滑移到該角色；手機直式時把角色放在畫面上方（聊天面板在下方）
function focusChar(n){const c=chars.find(o=>o.name===n);if(!c)return;const z=Math.max(cam.z,fitZ()*2.5);camT.z=z;camT.x=c.x;camT.y=c.y-30+(isPortrait()?innerHeight*0.28/z:0);clampCam(camT);}
function openChatWith(n){focusChar(n);CHAT_TO=n;if(!pass()){PENDING_CHAT=n;openPanel();setTimeout(()=>document.getElementById('lkp').focus(),50);return;}
 openPanel();setTab('chat');}
function anyUnread(){const open=document.getElementById('tp').classList.contains('open')&&TAB==='chat';return !!pass()&&targets().some(n=>!(open&&n===CHAT_TO)&&unread(n));}

</script><script>(function(){const K='island_ui_min',b=document.getElementById('uiBtn');
function ap(m){document.body.classList.toggle('uiMin',m);b.textContent=m?'狀態 ◂':'狀態 ▸ 收起';b.setAttribute('aria-expanded',!m);}

// 2026-11-01 小島聊天顯示夥伴即時狀態（與地圖/真實紀錄同源：c.state 工位＝工作中，其餘＝休息）
function chChar(n){return chars.find(c=>c.name===n||(c.name||'').replace(/\s/g,'')===n||c.id===n);}
function chTask(n){const L=(typeof TASKS!=='undefined'&&TASKS)||[];const g=(x,a,b)=>x[a]!==undefined?x[a]:x[b];const x=L.find(x=>g(x,'狀態','status')==='進行中'&&(g(x,'接手','claimer')===n||(!g(x,'接手','claimer')&&g(x,'派給','assignee')===n)));return x?(g(x,'標題','title')||''):'';}
function updChatSt(){try{const bar=document.getElementById('chTo');if(!bar)return;bar.querySelectorAll('.pick[data-n]').forEach(b=>{const d=b.querySelector('.sd');if(!d)return;const c=chChar(b.dataset.n);if(!c){d.hidden=true;return;}const w=c.state==='work';d.hidden=false;d.className='sd '+(w?'w':'r');d.title=w?'工作中':'休息';});
 const e=document.getElementById('chSt'),c=chChar(CHAT_TO);if(!c||grp(CHAT_TO)||CHAT_TO==='全體'){e.hidden=true;return;}const w=c.state==='work',tk=w?chTask(CHAT_TO):'';e.hidden=false;e.className=w?'w':'r';e.textContent=w?'🟠 工作中'+(tk?'：'+tk:''):'🟢 休息中';e.title=e.textContent;}catch(err){}}
setInterval(updChatSt,2000);
// 2026-11-01 正在想提示：學長在某對話的最後一則還沒人回、3 分鐘內、且 Worker 已記夥伴讀到（seen_by 含 @read） → 顯示「X 看到了，正在想…」，對方人物頭上冒「…」
const TYPING_MS=180000;
function typingFor(conv){if(ME!=='學長')return null;const L=CHAT.filter(m=>inConv(m,conv));const m=L[L.length-1];if(!m||m.from!==ME||Date.now()-m.ts>TYPING_MS)return null;if(!(m.seen_by||[]).some(x=>String(x).startsWith('@read')))return null;// 2026-11-01 要等夥伴真的讀到（Worker 記 @read）才顯示
 const G=grp(conv);return {conv,who:G||conv==='全體'?'大家':conv,members:G?G.members:conv==='全體'?null:[conv]};}
let TYN=null,TYN_T=0;function typingNames(){if(TYN&&performance.now()-TYN_T<500)return TYN;TYN_T=performance.now();const s=new Set();let all=false;for(const n of targets()){const t=typingFor(n);if(!t)continue;if(!t.members)all=true;else t.members.forEach(x=>s.add(x));}return TYN={all,s};}
let TY_KEY='';function updTyping(){const box=document.getElementById('chL');if(!box)return;const t=TAB==='chat'?typingFor(CHAT_TO):null;let r=document.getElementById('chTy');
 if(!t){if(r)r.remove();TY_KEY='';return;}const k=t.conv+t.who;if(r&&TY_KEY===k)return;if(r)r.remove();TY_KEY=k;
 r=document.createElement('div');r.id='chTy';r.className='row';r.innerHTML='<div class="who">'+(t.who==='大家'?'<span class="av sm tx all">全</span>':avatar(t.who,'av sm'))+'</div><div><div class="nm">'+esc(t.who)+'</div><div class="bw"><div class="bub ty">'+esc(t.who)+'看到了，正在想<span class="tyd"><i>.</i><i>.</i><i>.</i></span></div></div></div>';
 const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.appendChild(r);if(nearBottom)box.scrollTop=box.scrollHeight;}

<script>
// 2026-11-01 背景音樂：海浪＋輕吉他循環、新任務叮一聲。預設靜音；選擇記在 localStorage，但每次開啟仍需一次使用者觸碰才發聲（手機自動播放限制）
(function(){const B='assets/audio/',VOL={guitar:0.35,waves:0.25,ding:0.6};let ac=null,buf={},src={},gain=null,on=localStorage.getItem('island_sound')==='on',started=false;
 const btn=document.getElementById('sndBtn');function ui(){btn.textContent=on?'🔊':'🔇';btn.title=on?'背景音樂：開（點一下靜音）':'背景音樂：關（點一下播放）';}ui();
 async function load(n,f){if(buf[n])return buf[n];const r=await fetch(B+f);buf[n]=await ac.decodeAudioData(await r.arrayBuffer());return buf[n];}
 async function ensure(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.connect(ac.destination);}if(ac.state==='suspended')await ac.resume();}
 async function loopStart(){if(started)return;started=true;try{const [g,w]=await Promise.all([load('guitar','guitar_forest_charm.mp3'),load('waves','waves_loop.mp3')]);
  for(const [n,b] of [['guitar',g],['waves',w]]){const s=ac.createBufferSource(),v=ac.createGain();s.buffer=b;s.loop=true;v.gain.value=VOL[n];s.connect(v).connect(gain);s.start();src[n]=s;}}catch(e){started=false;console.warn('audio',e);}}
 async function setOn(v){on=v;localStorage.setItem('island_sound',on?'on':'off');ui();if(on){await ensure();gain.gain.value=1;loopStart();}else if(ac){ac.suspend();}}
 btn.addEventListener('click',e=>{e.stopPropagation();setOn(!on);});
 // 上次選了開：第一次觸碰/點擊畫面時自動開始
 const first=()=>{removeEventListener('pointerdown',first,true);removeEventListener('keydown',first,true);if(on)setOn(true);};addEventListener('pointerdown',first,true);addEventListener('keydown',first,true);
 document.addEventListener('visibilitychange',()=>{if(!ac||!on)return;if(document.hidden)ac.suspend();else ac.resume();});
 window.ISLAND_DING=async function(){if(!on||!ac||ac.state!=='running')return;try{const b=await load('ding','ding.mp3'),s=ac.createBufferSource(),v=ac.createGain();s.buffer=b;v.gain.value=VOL.ding;s.connect(v).connect(gain);s.start();}catch(e){}};
 window.ISLAND_SOUND={get on(){return on},get state(){return ac&&ac.state},setOn};})();
</script><script>/* 2026-11-01 手機鍵盤跟隨 v2：只看可見高度是否明顯變小（< 全高×0.8）；高度回來就還原（Android 返回鍵收鍵盤不會 blur） */(function(){const vv=window.visualViewport,coarse=matchMedia('(pointer:coarse)').matches;if(!coarse)return;
const tp=document.getElementById('tp'),B=document.body;let raf=0,FULL=0,FW=0;
const curH=()=>vv?vv.height:innerHeight;
const inField=()=>{const a=document.activeElement;return a&&tp.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox'};
function full(){const w=Math.round(innerWidth),h=Math.max(innerHeight,document.documentElement.clientHeight||0,curH());if(Math.abs(w-FW)>40){FW=w;FULL=h;}else if(h>FULL)FULL=h;return FULL;}
function off(){if(B.classList.contains('kbd')){B.classList.remove('kbd');B.style.removeProperty('--vvh');B.style.removeProperty('--vvt');}}
function fit(){raf=0;const F=full(),h=curH(),open=h<F*0.8;
 if(!open||!inField()){off();return;}
 B.classList.add('kbd');B.style.setProperty('--vvh',h+'px');B.style.setProperty('--vvt',(vv?vv.offsetTop:0)+'px');
 const a=document.activeElement;if(a&&a.id==='chT'){const L=document.getElementById('chL');if(L)L.scrollTop=L.scrollHeight}try{a.scrollIntoView({block:'nearest'})}catch(e){}}
const q=()=>{if(!raf)raf=requestAnimationFrame(fit)};window.ISLAND_KBD={fit,full:()=>FULL};
if(vv){vv.addEventListener('resize',q);vv.addEventListener('scroll',q)}addEventListener('resize',q);addEventListener('orientationchange',()=>{FW=0;setTimeout(q,400)});
document.addEventListener('focusin',()=>{q();setTimeout(q,300);setTimeout(q,700)});document.addEventListener('focusout',()=>setTimeout(q,50));
// 保險：點訊息區／輸入框以外的地方就還原並收鍵盤
document.addEventListener('pointerdown',e=>{if(!B.classList.contains('kbd'))return;if(e.target.closest&&e.target.closest('#chF'))return;const a=document.activeElement;if(a&&a.blur&&/^(INPUT|TEXTAREA)$/.test(a.tagName))a.blur();off();},true);
setInterval(()=>{if(B.classList.contains('kbd'))q();},1000);// 萬一沒有任何事件，也每秒檢查高度一次
})();</script>
